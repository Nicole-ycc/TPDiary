openapi: 3.0.3
info:
  title: TPDiary API
  version: 0.1.0
  description: |
    TPDiary 一期 MVP 接口契约。
    统一响应为 { code, message, data, traceId }，成功业务码为 0。
    ID 在 JSON 中以十进制字符串传输，避免 JavaScript 64 位整数精度丢失。
    时间使用带时区偏移的 ISO 8601；额度与时长统一使用整数秒。
servers:
  - url: /
tags:
  - name: Auth
    description: 注册、登录、验证码、密码找回和游客 Token
  - name: User
    description: 用户资料
  - name: Task
    description: 短任务、长期任务和奖励节点
  - name: AI
    description: AI 任务拆解
  - name: Timer
    description: 专注和躺平计时
  - name: Quota
    description: 额度余额、批次和流水
  - name: Proctor
    description: 在岗督学
  - name: Reminder
    description: 智能提醒配置
  - name: Dashboard
    description: 数据看板
  - name: Community
    description: 轻量社区
  - name: File
    description: 文件上传
security:
  - bearerAuth: []
paths:
  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: 手机号注册
      security: []
      x-auth-required: false
      x-guest-supported: false
      x-rate-limit: {limit: 5, windowSeconds: 60, scope: ip}
      x-error-codes: [40001, 40002, 40104, 40901, 42901, 50000]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResponse'}
        '400': {$ref: '#/components/responses/Api400'}
        '409': {$ref: '#/components/responses/Api409'}
        '429': {$ref: '#/components/responses/Api429'}
        '500': {$ref: '#/components/responses/Api500'}
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 密码或短信验证码登录
      security: []
      x-auth-required: false
      x-guest-supported: false
      x-rate-limit: {limit: 10, windowSeconds: 60, scope: ip}
      x-error-codes: [40001, 40104, 40105, 42901, 50000]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResponse'}
        '400': {$ref: '#/components/responses/Api400'}
        '401': {$ref: '#/components/responses/Api401'}
        '429': {$ref: '#/components/responses/Api429'}
        '500': {$ref: '#/components/responses/Api500'}
  /api/v1/auth/sms-code:
    post:
      tags: [Auth]
      operationId: sendSmsCode
      summary: 发送短信验证码
      security: []
      x-auth-required: false
      x-guest-supported: false
      x-rate-limit: {limit: 5, windowSeconds: 60, scope: ip+phone}
      x-error-codes: [40001, 42901, 50000]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SmsCodeRequest'}
      responses:
        '200':
          description: 验证码已受理
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcceptedResponse'}
        '400': {$ref: '#/components/responses/Api400'}
        '429': {$ref: '#/components/responses/Api429'}
        '500': {$ref: '#/components/responses/Api500'}
  /api/v1/auth/password/reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: 通过短信验证码找回密码
      security: []
      x-auth-required: false
      x-guest-supported: false
      x-rate-limit: {limit: 5, windowSeconds: 60, scope: ip+phone}
      x-error-codes: [40001, 40104, 40401, 42901, 50000]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordResetRequest'}
      responses:
        '200':
          description: 密码已重置
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcceptedResponse'}
        '400': {$ref: '#/components/responses/Api400'}
        '401': {$ref: '#/components/responses/Api401'}
        '404': {$ref: '#/components/responses/Api404'}
        '429': {$ref: '#/components/responses/Api429'}
        '500': {$ref: '#/components/responses/Api500'}
  /api/v1/auth/guest:
    post:
      tags: [Auth]
      operationId: createGuestToken
      summary: 创建游客 Token
      security: []
      x-auth-required: false
      x-guest-supported: false
      x-rate-limit: {limit: 20, windowSeconds: 60, scope: ip}
      x-error-codes: [42901, 50000]
      responses:
        '200':
          description: 游客 Token
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResponse'}
        '429': {$ref: '#/components/responses/Api429'}
        '500': {$ref: '#/components/responses/Api500'}
  /api/v1/user/profile:
    get:
      tags: [User]
      operationId: getProfile
      summary: 查询个人资料
      x-auth-required: true
      x-guest-supported: false
      x-rate-limit: {limit: 120, windowSeconds: 60, scope: userId}
      x-error-codes: [40100, 40101, 40300, 40103, 40401, 42901, 50000]
      responses:
        '200':
          description: 个人资料
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProfileResponse'}
        '401': {$ref: '#/components/responses/Api401'}
        '403': {$ref: '#/components/responses/Api403'}
        '404': {$ref: '#/components/responses/Api404'}
        '429': {$ref: '#/components/responses/Api429'}
        '500': {$ref: '#/components/responses/Api500'}
    put:
      tags: [User]
      operationId: updateProfile
      summary: 编辑个人资料
      x-auth-required: true
      x-guest-supported: false
      x-rate-limit: {limit: 30, windowSeconds: 60, scope: userId}
      x-error-codes: [40001, 40002, 40100, 40101, 40300, 40103, 42901, 50000]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserProfileUpdateRequest'}
      responses:
        '200':
          description: 更新后的个人资料
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProfileResponse'}
        '400': {$ref: '#/components/responses/Api400'}
        '401': {$ref: '#/components/responses/Api401'}
        '403': {$ref: '#/components/responses/Api403'}
        '429': {$ref: '#/components/responses/Api429'}
        '500': {$ref: '#/components/responses/Api500'}
  /api/v1/user/avatar:
    post:
      tags: [User]
      operationId: uploadAvatar
      summary: 上传头像
      x-auth-required: true
      x-guest-supported: false
      x-rate-limit: {limit: 10, windowSeconds: 60, scope: userId}
      x-error-codes: [40003, 40004, 40100, 40101, 40300, 40103, 42901, 50002, 50000]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 头像地址
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileUploadResponse'}
        '400': {$ref: '#/components/responses/Api400'}
        '401': {$ref: '#/components/responses/Api401'}
        '403': {$ref: '#/components/responses/Api403'}
        '413': {$ref: '#/components/responses/Api413'}
        '429': {$ref: '#/components/responses/Api429'}
        '500': {$ref: '#/components/responses/Api500'}
  /api/v1/tasks:
    post:
      tags: [Task]
      operationId: createTask
      summary: 创建任务
      x-auth-required: true
      x-guest-supported: false
      x-rate-limit: {limit: 30, windowSeconds: 60, scope: userId}
      x-error-codes: [40001, 40002, 40100, 40101, 40300, 40103, 40908, 42901, 50000]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskWriteRequest'}
      responses:
        '200':
          description: 创建后的任务
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskResponse'}
        '400': {$ref: '#/components/responses/Api400'}
        '401': {$ref: '#/components/responses/Api401'}
        '403': {$ref: '#/components/responses/Api403'}
        '409': {$ref: '#/components/responses/Api409'}
        '429': {$ref: '#/components/responses/Api429'}
        '500': {$ref: '#/components/responses/Api500'}
    get:
      tags: [Task]
      operationId: listTasks
      summary: 查询任务列表
      x-auth-required: true
      x-guest-supported: false
      x-rate-limit: {limit: 120, windowSeconds: 60, scope: userId}
      x-error-codes: [40001, 40100, 40101, 40300, 40103, 42901, 50000]
      parameters:
        - name: type
          in: query
          schema: {$ref: '#/components/schemas/TaskType'}
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/TaskStatus'}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 分页任务列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskListResponse'}
        '400': {$ref: '#/components/responses/Api400'}
        '401': {$ref: '#/components/responses/Api401'}
        '403': {$ref: '#/components/responses/Api403'}
        '429': {$ref: '#/components/responses/Api429'}
        '500': {$ref: '#/components/responses/Api500'}
  /api/v1/tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      tags: [Task]
      operationId: getTask
      summary: 查询任务详情
      x-auth-required: true
      x-guest-supported: false
      x-rate-limit: {limit: 120, windowSeconds: 60, scope: userId}
      x-error-codes: [40100, 40101, 40300, 40103, 40401, 40303, 42901, 50000]
      responses:
        '200':
          description: 任务详情
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskResponse'}
        '401': {$ref: '#/components/responses/Api401'}
        '403': {$ref: '#/components/responses/Api403'}
        '404': {$ref: '#/components/responses/Api404'}
        '429': {$ref: '#/components/responses/Api429'}
        '500': {$ref: '#/components/responses/Api500'}
    put:
      tags: [Task]
      operationId: updateTask
      summary: 编辑任务
      x-auth-required: true
      x-guest-supported: false
      x-rate-limit: {limit: 30, windowSeconds: 60, scope: userId}
      x-error-codes: [40001, 40002, 40100, 40101, 40300, 40103, 40303, 40401, 40908, 42901, 50000]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskWriteRequest'}
      responses:
        '200':
          description: 更新后的任务
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskResponse'}
        '400': {$ref: '#/components/responses/Api400'}
        '401': {$ref: '#/components/responses/Api401'}
        '403': {$ref: '#/components/responses/Api403'}
        '404': {$ref: '#/components/responses/Api404'}
        '409': {$ref: '#/components/responses/Api409'}
        '429': {$ref: '#/components/responses/Api429'}
        '500': {$ref: '#/components/responses/Api500'}
    delete:
      tags: [Task]
      operationId: deleteTask
      summary: 删除任务
      x-auth-required: true
      x-guest-supported: false
      x-rate-limit: {limit: 20, windowSeconds: 60, scope: userId}
      x-error-codes: [40100, 40101, 40300, 40103, 40303, 40401, 40908, 42901, 50000]
      responses:
        '200':
          description: 删除结果
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SimpleResultResponse'}
        '401': {$ref: '#/components/responses/Api401'}
        '403': {$ref: '#/components/responses/Api403'}
        '404': {$ref: '#/components/responses/Api404'}
        '409': {$ref: '#/components/responses/Api409'}
        '429': {$ref: '#/components/responses/Api429'}
        '500': {$ref: '#/components/responses/Api500'}
  /api/v1/tasks/{id}/nodes:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      tags: [Task]
      operationId: createTaskNodes
      summary: 新增任务奖励节点
      x-auth-required: true
      x-guest-supported: false
      x-rate-limit: {limit: 30, windowSeconds: 60, scope: userId}
      x-error-codes: [40001, 40100, 40101, 40300, 40103, 40303, 40401, 40908, 42901, 50000]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskNodesWriteRequest'}
      responses:
        '200':
          description: 节点列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskNodeListResponse'}
        '400': {$ref: '#/components/responses/Api400'}
        '401': {$ref: '#/components/responses/Api401'}
        '403': {$ref: '#/components/responses/Api403'}
        '404': {$ref: '#/components/responses/Api404'}
        '409': {$ref: '#/components/responses/Api409'}
        '429': {$ref: '#/components/responses/Api429'}
        '500': {$ref: '#/components/responses/Api500'}
    put:
      tags: [Task]
      operationId: replaceTaskNodes
      summary: 替换未领取的任务奖励节点
      x-auth-required: true
      x-guest-supported: false
      x-rate-limit: {limit: 30, windowSeconds: 60, scope: userId}
      x-error-codes: [40001, 40100, 40101, 40300, 40103, 40303, 40401, 40908, 42901, 50000]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskNodesWriteRequest'}
      responses:
        '200':
          description: 节点列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskNodeListResponse'}
        '400': {$ref: '#/components/responses/Api400'}
        '401': {$ref: '#/components/responses/Api401'}
        '403': {$ref: '#/components/responses/Api403'}
        '404': {$ref: '#/components/responses/Api404'}
        '409': {$ref: '#/components/responses/Api409'}
        '429': {$ref: '#/components/responses/Api429'}
        '500': {$ref: '#/components/responses/Api500'}
  /api/v1/tasks/{id}/nodes/{nodeId}/claim:
    parameters:
      - $ref: '#/components/parameters/PathId'
      - name: nodeId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Id'}
    post:
      tags: [Task]
      operationId: claimTaskNode
      summary: 完成并领取任务节点奖励
      x-auth-required: true
      x-guest-supported: false
      x-rate-limit: {limit: 20, windowSeconds: 60, scope: userId}
      x-error-codes: [40100, 40101, 40300, 40103, 40303, 40401, 40907, 40909, 42901, 50000]
      x-idempotency:
        mechanism: node-status-and-unique-ledger-key
        key: 'NODE_REWARD:{nodeId}'
        samePayload: return-original-success
        differentPayload: 40909
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 节点奖励结果
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NodeClaimResponse'}
        '401': {$ref: '#/components/responses/Api401'}
        '403': {$ref: '#/components/responses/Api403'}
        '404': {$ref: '#/components/responses/Api404'}
        '409': {$ref: '#/components/responses/Api409'}
        '429': {$ref: '#/components/responses/Api429'}
        '500': {$ref: '#/components/responses/Api500'}
  /api/v1/ai/plan:
    post:
      tags: [AI]
      operationId: generateAiPlan
      summary: 生成任务拆解与学习规划
      x-auth-required: true
      x-guest-supported: false
      x-rate-limit: {limit: 10, windowSeconds: 60, scope: userId}
      x-error-codes: [40001, 40002, 40100, 40101, 40300, 40103, 40401, 42901, 50001, 50000]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AiPlanRequest'}
      responses:
        '200':
          description: 成功结果或规则模板降级结果
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiPlanResponse'}
        '400': {$ref: '#/components/responses/Api400'}
        '401': {$ref: '#/components/responses/Api401'}
        '403': {$ref: '#/components/responses/Api403'}
        '404': {$ref: '#/components/responses/Api404'}
        '429': {$ref: '#/components/responses/Api429'}
        '500': {$ref: '#/components/responses/Api500'}
  /api/v1/focus/start:
    post:
      tags: [Timer]
      operationId: startFocus
      summary: 开始专注
      x-auth-required: true
      x-guest-supported: true
      x-rate-limit: {limit: 10, windowSeconds: 60, scope: userId}
      x-error-codes: [40001, 40100, 40101, 40103, 40902, 42901, 50000]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FocusStartRequest'}
      responses:
        '200':
          description: 当前专注会话
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FocusSessionResponse'}
        '400': {$ref: '#/components/responses/Api400'}
        '401': {$ref: '#/components/responses/Api401'}
        '409': {$ref: '#/components/responses/Api409'}
        '429': {$ref: '#/components/responses/Api429'}
        '500': {$ref: '#/components/responses/Api500'}
  /api/v1/focus/pause:
    post:
      tags: [Timer]
      operationId: pauseFocus
      summary: 暂停专注
      x-auth-required: true
      x-guest-supported: true
      x-rate-limit: {limit: 60, windowSeconds: 60, scope: userId}
      x-error-codes: [40001, 40100, 40101, 40103, 40401, 40902, 42901, 50000]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FocusSessionActionRequest'}
      responses:
        '200':
          description: 更新后的会话
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FocusSessionResponse'}
        '400': {$ref: '#/components/responses/Api400'}
        '401': {$ref: '#/components/responses/Api401'}
        '404': {$ref: '#/components/responses/Api404'}
        '409': {$ref: '#/components/responses/Api409'}
        '429': {$ref: '#/components/responses/Api429'}
        '500': {$ref: '#/components/responses/Api500'}
  /api/v1/focus/resume:
    post:
      tags: [Timer]
      operationId: resumeFocus
      summary: 恢复专注
      x-auth-required: true
      x-guest-supported: true
      x-rate-limit: {limit: 60, windowSeconds: 60, scope: userId}
      x-error-codes: [40001, 40100, 40101, 40103, 40401, 40902, 42901, 50000]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FocusSessionActionRequest'}
      responses:
        '200':
          description: 更新后的会话
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FocusSessionResponse'}
        '400': {$ref: '#/components/responses/Api400'}
        '401': {$ref: '#/components/responses/Api401'}
        '404': {$ref: '#/components/responses/Api404'}
        '409': {$ref: '#/components/responses/Api409'}
        '429': {$ref: '#/components/responses/Api429'}
        '500': {$ref: '#/components/responses/Api500'}
  /api/v1/focus/stop:
    post:
      tags: [Timer]
      operationId: stopFocus
      summary: 结束专注并结算额度
      description: |
        首次服务端接受时间写入会话 end_time，并作为日/周归属时间。
        重复提交同一 sessionId 返回原结算结果。
      x-auth-required: true
      x-guest-supported: true
      x-rate-limit: {limit: 20, windowSeconds: 60, scope: userId}
      x-error-codes: [40001, 40002, 40100, 40101, 40103, 40401, 40902, 40909, 42901, 50000]
      x-idempotency:
        mechanism: session-settled-flag-and-ledger-key
        key: 'FOCUS_SETTLE:{sessionId}'
        samePayload: return-original-success
        differentPayload: 40909
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FocusStopRequest'}
      responses:
        '200':
          description: 专注结算结果
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FocusSettlementResponse'}
        '400': {$ref: '#/components/responses/Api400'}
        '401': {$ref: '#/components/responses/Api401'}
        '404': {$ref: '#/components/responses/Api404'}
        '409': {$ref: '#/components/responses/Api409'}
        '429': {$ref: '#/components/responses/Api429'}
        '500': {$ref: '#/components/responses/Api500'}
  /api/v1/focus/current:
    get:
      tags: [Timer]
      operationId: getCurrentFocus
      summary: 查询当前专注会话
      x-auth-required: true
      x-guest-supported: true
      x-rate-limit: {limit: 120, windowSeconds: 60, scope: userId}
      x-error-codes: [40100, 40101, 40103, 42901, 50000]
      responses:
        '200':
          description: 当前专注会话；无会话时 data.session 为 null
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentFocusResponse'}
        '401': {$ref: '#/components/responses/Api401'}
        '429': {$ref: '#/components/responses/Api429'}
        '500': {$ref: '#/components/responses/Api500'}
  /api/v1/rest/start:
    post:
      tags: [Timer]
      operationId: startRest
      summary: 开始躺平
      description: 余额为 0 时返回 40905 且不创建会话。
      x-auth-required: true
      x-guest-supported: false
      x-rate-limit: {limit: 30, windowSeconds: 60, scope: userId}
      x-error-codes: [40100, 40101, 40300, 40103, 40904, 40905, 40909, 42901, 50000]
      x-idempotency:
        mechanism: active-session-and-idempotency-key
        key: 'REST_START:{userId}:{Idempotency-Key}'
        samePayload: return-original-success
        differentPayload: 40909
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 躺平会话和实时余额
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RestStartResponse'}
        '401': {$ref: '#/components/responses/Api401'}
        '403': {$ref: '#/components/responses/Api403'}
        '409': {$ref: '#/components/responses/Api409'}
        '429': {$ref: '#/components/responses/Api429'}
        '500': {$ref: '#/components/responses/Api500'}
  /api/v1/rest/stop:
    post:
      tags: [Timer]
