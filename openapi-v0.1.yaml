components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 登录用户与游客均使用 Authorization Bearer；游客能力由 x-guest-supported 标记。
  parameters:
    PathId:
      name: id
      in: path
      required: true
      description: 资源 ID，JSON 中以十进制字符串传输
      schema: {$ref: '#/components/schemas/Id'}
    Page:
      name: page
      in: query
      description: 页码，从 1 开始
      schema: {type: integer, minimum: 1, default: 1}
    PageSize:
      name: pageSize
      in: query
      description: 每页数量，最大 100
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 客户端生成的 8～128 字符幂等键；同键同请求返回原结果，同键不同载荷返回 40909。
      schema: {type: string, minLength: 8, maxLength: 128, example: '7a2f3c8d-8a55-4a67-9f44-b90119f5421e'}
  responses:
    Api400:
      description: 请求参数错误
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiErrorResponse'}
    Api401:
      description: 未认证或 Token 无效
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiErrorResponse'}
    Api403:
      description: 权限不足
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiErrorResponse'}
    Api404:
      description: 资源不存在
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiErrorResponse'}
    Api409:
      description: 业务状态冲突
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiErrorResponse'}
    Api413:
      description: 上传内容过大
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiErrorResponse'}
    Api429:
      description: 请求过多
      headers:
        Retry-After:
          description: 建议重试等待秒数
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiErrorResponse'}
    Api500:
      description: 系统异常
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiErrorResponse'}
  schemas:
    Id:
      type: string
      pattern: '^[1-9][0-9]*$'
      description: 数据库 BIGINT ID 的十进制字符串表示。
    TaskType:
      type: string
      enum: [DAILY, PERIODIC]
    TaskStatus:
      type: string
      enum: [PENDING, IN_PROGRESS, COMPLETED, CANCELLED]
    Timestamp:
      type: string
      format: date-time
      description: ISO 8601 时间，必须包含时区偏移。
      example: '2026-10-23T23:59:59.700+08:00'
    Seconds:
      type: integer
      format: int64
      minimum: 0
      description: 非负整数秒；禁止浮点。
    ResponseBase:
      type: object
      required: [code, message, traceId]
      properties:
        code:
          type: integer
          example: 0
          description: 0 表示成功，其他值见错误码字典。
        message:
          type: string
          example: ok
        traceId:
          type: string
          minLength: 8
          maxLength: 64
          example: '4f4c57b631e94b5794f37f6f4c66de19'
    ApiErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseBase'
        - type: object
          required: [data]
          properties:
            data:
              nullable: true
              description: 错误时固定为 null。
    AcceptedData:
      type: object
      required: [accepted]
      properties:
        accepted: {type: boolean, example: true}
        message: {type: string, nullable: true}
    AcceptedResponse:
